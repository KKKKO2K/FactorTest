name: Liquidity Train OOS and ex-K200

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/liquidity_cross_factor/summarize_train_oos.py
      - research/liquidity_cross_factor/run_ex_k200_liquidity.py
      - .github/workflows/liquidity-train-exk200.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Summarize K200 train vs OOS
        run: python research/liquidity_cross_factor/summarize_train_oos.py
      - name: Run KOSPI ex-K200 research
        run: python research/liquidity_cross_factor/run_ex_k200_liquidity.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidity_cross_factor/results/ research/liquidity_cross_factor/results_ex_k200/
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Add train-OOS and ex-K200 liquidity results [skip ci]"
          git push origin HEAD:research/factor-lab-v2
