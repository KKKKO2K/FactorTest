name: Factor Payoff Surface

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/factor_payoff_surface/run_payoff_surface.py
      - .github/workflows/factor-payoff-surface.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factor-payoff-surface
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
          sparse-checkout: |
            research/factor_payoff_surface
            research/factor_regime_contemporaneous_states/results/nested_state_assignments.csv
            research/factor_regime_full_state_map/results/family_primitives.csv
            research/factor_regime_full_state_map/results/family_states_static.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run continuous payoff-surface research
        run: python research/factor_payoff_surface/run_payoff_surface.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/factor_payoff_surface/results/
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Add continuous payoff-surface results [skip ci]"
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
