name: Sector Decomposition Reset V2

on:
  push:
    branches: [ research/sector-decomposition-reset-v2 ]
    paths:
      - '.github/workflows/sector-decomposition-reset-v2.yml'
      - 'research/sector_decomposition_reset/**'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/sector-decomposition-reset-v2.yml'
      - 'research/sector_decomposition_reset/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sector-decomposition-reset-v2
  cancel-in-progress: true

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sector-decomposition-reset-v2
          fetch-depth: 1
          sparse-checkout: |
            source/factor_all_values
            research/sector_decomposition_reset
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run sector decomposition stage 1
        working-directory: research/sector_decomposition_reset
        run: python run_stage1_sector_decomposition.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sector_decomposition_reset/results_stage1
          git diff --cached --quiet || git commit -m 'Add sector decomposition stage 1 results [skip ci]'
          git pull --rebase origin research/sector-decomposition-reset-v2
          git push origin HEAD:research/sector-decomposition-reset-v2
