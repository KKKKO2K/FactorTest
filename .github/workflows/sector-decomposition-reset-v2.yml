name: Sector Decomposition Reset V2

on:
  push:
    branches: [ research/sector-decomposition-reset-v2 ]
    paths:
      - '.github/workflows/sector-decomposition-reset-v2.yml'
      - 'research/sector_decomposition_reset/**'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/sector-decomposition-reset-v2.yml'
      - 'research/sector_decomposition_reset/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sector-decomposition-reset-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sector-decomposition-reset-v2
          fetch-depth: 1
          sparse-checkout: |
            source/factor_all_values
            research/sector_decomposition_reset
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Ensure sector decomposition stage 1 exists
        working-directory: research/sector_decomposition_reset
        run: |
          if [ ! -f results_stage1/sector_decomposition_panel.csv ]; then
            python run_stage1_sector_decomposition.py
          else
            echo 'Stage 1 results already present; reuse frozen outputs.'
          fi
      - name: Run sector-quality selection stage 2
        working-directory: research/sector_decomposition_reset
        run: python run_stage2_selection_quality.py
      - name: Run sector-confirmed raw winner stage 3
        working-directory: research/sector_decomposition_reset
        run: python run_stage3_confirmation_veto.py
      - name: Run fixed sector-confirmation portfolio stage 4
        working-directory: research/sector_decomposition_reset
        run: python run_stage4_fixed_veto_portfolio.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sector_decomposition_reset/results_stage1 research/sector_decomposition_reset/results_stage2 research/sector_decomposition_reset/results_stage3 research/sector_decomposition_reset/results_stage4
          git diff --cached --quiet || git commit -m 'Add fixed sector-confirmation portfolio results [skip ci]'
          git pull --rebase origin research/sector-decomposition-reset-v2
          git push origin HEAD:research/sector-decomposition-reset-v2
