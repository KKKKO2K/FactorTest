name: factor-rotation-event-lab

on:
  push:
    branches:
      - analysis/conditional-factor-combos
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run conditional factor rotation and event lab
        run: python analysis/factor_rotation_event_lab_fixed.py
      - name: Run stock attribution and outlier diagnostics
        run: python analysis/factor_strategy_attribution.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-rotation-event-and-attribution-results
          path: |
            analysis/factor_rotation_event_results
            analysis/factor_strategy_attribution_results
          if-no-files-found: warn
