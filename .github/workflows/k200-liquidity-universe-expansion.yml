name: k200-liquidity-universe-expansion

on:
  push:
    branches:
      - analysis/k200-liquidity-universe-expansion-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liquidity:
    strategy:
      fail-fast: false
      matrix:
        add_n: [50, 100]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ADD_N: ${{ matrix.add_n }}
      TA_LOOKBACK: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Overlay latest main factor data
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- source/factor_all_values
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate yfinance requests
      - name: Run liquidity universe expansion
        run: python analysis/k200_liquidity_universe_expansion.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k200-liquidity-universe-plus-${{ matrix.add_n }}
          path: analysis/k200_liquidity_universe_expansion_results/PLUS_${{ matrix.add_n }}
          if-no-files-found: warn
