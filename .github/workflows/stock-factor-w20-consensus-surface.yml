name: Stock Factor W20 Consensus Surface

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/stock_level_factor_interaction/validate_w20_consensus_surface.py
      - .github/workflows/stock-factor-w20-consensus-surface.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
          sparse-checkout: |
            research/stock_level_factor_interaction/validate_w20_consensus_surface.py
            research/stock_level_factor_interaction/results_mechanism_liquidity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run consensus surface bootstrap
        run: python research/stock_level_factor_interaction/validate_w20_consensus_surface.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse research/stock_level_factor_interaction/results_mechanism_liquidity/
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Add W20 consensus surface bootstrap [skip ci]"
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
