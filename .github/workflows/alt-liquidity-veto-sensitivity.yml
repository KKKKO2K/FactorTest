name: Alternative Liquidity Veto Sensitivity

on:
  push:
    branches: [ research/factor-lab-v2 ]
    paths:
      - 'research/stock_level_factor_interaction/run_alt_liquidity_veto_sensitivity.py'
      - '.github/workflows/alt-liquidity-veto-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run alternative liquidity veto sensitivity
        run: python research/stock_level_factor_interaction/run_alt_liquidity_veto_sensitivity.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/stock_level_factor_interaction/results_alt_liquidity_veto_sensitivity
          git diff --cached --quiet || git commit -m 'Add alternative liquidity veto sensitivity results [skip ci]'
          git push origin HEAD:research/factor-lab-v2
