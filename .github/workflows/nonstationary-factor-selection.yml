name: Nonstationary Factor Selection

on:
  push:
    branches: [ research/nonstationary-factor-selection ]
    paths:
      - '.github/workflows/nonstationary-factor-selection.yml'
      - 'research/nonstationary_factor_selection/**'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/nonstationary-factor-selection.yml'
      - 'research/nonstationary_factor_selection/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nonstationary-factor-selection
  cancel-in-progress: true

jobs:
  run-all-selection-methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nonstationary-factor-selection
          fetch-depth: 1
          sparse-checkout: |
            research/factor_regime_v1/results/factor_5d_returns.csv
            research/nonstationary_factor_selection
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run all factor-selection methods
        working-directory: research/nonstationary_factor_selection
        run: python run_all_selection_methods.py
      - name: Commit research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nonstationary_factor_selection/results
          git diff --cached --quiet || git commit -m 'Add non-stationary factor selection results [skip ci]'
          git pull --rebase origin research/nonstationary-factor-selection
          git push origin HEAD:research/nonstationary-factor-selection
