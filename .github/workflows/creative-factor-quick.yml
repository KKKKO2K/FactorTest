name: creative-factor-quick

on:
  push:
    branches:
      - analysis/creative-factor-lab
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run focused creative factor lab
        run: python analysis/creative_factor_lab_quick.py
      - name: Upload focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-factor-quick-results
          path: analysis/creative_factor_results
          if-no-files-found: warn
