name: universe-state-engine-heterogeneity

on:
  push:
    branches:
      - analysis/universe-state-engine-heterogeneity-v1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Overlay latest main factor data
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- source/factor_all_values

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate yfinance requests

      - name: Run heterogeneity test
        run: python analysis/universe_state_engine_heterogeneity.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-state-engine-heterogeneity-results
          path: analysis/universe_state_engine_heterogeneity_results
          if-no-files-found: warn
