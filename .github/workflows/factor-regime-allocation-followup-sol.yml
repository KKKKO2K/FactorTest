name: factor-regime-allocation-followup-sol

on:
  workflow_dispatch:
  push:
    branches:
      - research/factor-lab-sol
    paths:
      - research/factor_regime_sol/run_factor_allocation_followup.py
      - research/factor_regime_sol/run_factor_allocation_followup_v2.py
      - .github/workflows/factor-regime-allocation-followup-sol.yml
  pull_request:
    branches:
      - research/factor-lab-sol
    paths:
      - research/factor_regime_sol/run_factor_allocation_followup.py
      - research/factor_regime_sol/run_factor_allocation_followup_v2.py
      - .github/workflows/factor-regime-allocation-followup-sol.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1
          sparse-checkout: |
            research/factor_regime_sol/results
            research/factor_regime_sol/run_factor_allocation_followup.py
            research/factor_regime_sol/run_factor_allocation_followup_v2.py
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Run v2 and persist status
        run: |
          set +e
          mkdir -p research/factor_regime_sol/allocation_run_status_v2
          python research/factor_regime_sol/run_factor_allocation_followup_v2.py > research/factor_regime_sol/allocation_run_status_v2/run.log 2>&1
          echo "$?" > research/factor_regime_sol/allocation_run_status_v2/exit_code.txt
          cat research/factor_regime_sol/allocation_run_status_v2/run.log
          exit 0
      - name: Commit results
        run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add --sparse research/factor_regime_sol/results_allocation_followup_v2 research/factor_regime_sol/allocation_run_status_v2
          git commit -m "Run factor regime allocation follow-up v2" || exit 0
          git pull --rebase origin research/factor-lab-sol
          git push origin HEAD:research/factor-lab-sol
