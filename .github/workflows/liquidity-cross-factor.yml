name: Cross-Factor Trading Value Research

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/liquidity_cross_factor/run_cross_factor_liquidity.py
      - research/liquidity_cross_factor/run_cross_factor_liquidity_fixed.py
      - research/liquidity_cross_factor/run_sign_robustness.py
      - .github/workflows/liquidity-cross-factor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Run cross-factor liquidity research
        run: python research/liquidity_cross_factor/run_cross_factor_liquidity_fixed.py

      - name: Run factor-direction robustness
        run: python research/liquidity_cross_factor/run_sign_robustness.py

      - name: Commit research outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidity_cross_factor/results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Add cross-factor trading value research results [skip ci]"
          git push origin HEAD:research/factor-lab-v2
