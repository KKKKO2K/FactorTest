name: Factor Quality Internals V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factor-quality-internals-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-quality-internals-v1
          fetch-depth: 1
          sparse-checkout: |
            source/factor_all_values
            research/sector_decomposition_reset
            research/factor_quality_internals
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Build stock-level factor quality panel
        working-directory: research/factor_quality_internals
        run: python run_stage1_build_quality_panel_float64.py
      - name: Run preregistered incremental quality tests
        working-directory: research/factor_quality_internals
        run: python run_stage2_incremental_quality_test.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/factor_quality_internals/results_stage1 research/factor_quality_internals/results_stage2
          git diff --cached --quiet || git commit -m 'Add factor quality internals stage 1-2 results [skip ci]'
          git pull --rebase origin research/factor-quality-internals-v1
          git push origin HEAD:research/factor-quality-internals-v1
