name: k200-actual-index-comparison

on:
  push:
    branches:
      - analysis/attribution-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate yfinance
      - name: Run actual-index comparison
        run: python analysis/k200_actual_index_comparison.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k200-actual-index-results
          path: analysis/k200_actual_index_results
          if-no-files-found: warn
