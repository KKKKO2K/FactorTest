name: OPFY1 Regime Gate

on:
  push:
    branches: [ research/opfy1-regime-gate ]
    paths:
      - 'research/factor_regime_action_policy/run_opfy1_regime_gate.py'
      - '.github/workflows/opfy1-regime-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opfy1-regime-gate
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opfy1-regime-gate
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run OPFY1 regime gate audit
        working-directory: research/factor_regime_action_policy
        run: python run_opfy1_regime_gate.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/factor_regime_action_policy/results_opfy1_regime_gate
          git diff --cached --quiet || git commit -m 'Add OPFY1 regime gate results [skip ci]'
          git pull --rebase origin research/opfy1-regime-gate
          git push origin HEAD:research/opfy1-regime-gate

