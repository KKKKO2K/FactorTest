name: factor-regime-sol

on:
  workflow_dispatch:
  push:
    branches:
      - research/factor-lab-sol
    paths:
      - research/factor_regime_sol/run_factor_regime_sol.py
      - .github/workflows/factor-regime-sol.yml

permissions:
  contents: write

concurrency:
  group: factor-regime-sol
  cancel-in-progress: true

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1
          sparse-checkout: |
            source/factor_all_values/reference_snapshots/basic_info
            source/factor_all_values/OP(12MF_1M_CHG)
            source/factor_all_values/OP(FY1_1M_CHG)
            source/factor_all_values/PBR(12MF)
            source/factor_all_values/PER(12MF)
            source/factor_all_values/사모수급
            source/factor_all_values/외국인수급
            research/weighted_momentum_filter_sol
            research/factor_regime_sol
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Run exact weighted-momentum regime research
        run: python research/factor_regime_sol/run_factor_regime_sol.py

      - name: Commit results
        run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add research/factor_regime_sol/results
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Run exact weighted-momentum factor regime research"
            git pull --rebase origin research/factor-lab-sol
            git push origin HEAD:research/factor-lab-sol
          fi
