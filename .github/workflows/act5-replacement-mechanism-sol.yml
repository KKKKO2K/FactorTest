name: act5-replacement-mechanism-sol

on:
  workflow_dispatch:
  push:
    branches:
      - research/factor-lab-sol
    paths:
      - research/liquidity_wmom_sol/run_act5_replacement_mechanism.py
      - .github/workflows/act5-replacement-mechanism-sol.yml

permissions:
  contents: write

concurrency:
  group: act5-replacement-mechanism-sol
  cancel-in-progress: true

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1
          sparse-checkout: |
            source/factor_all_values/reference_snapshots/basic_info
            source/factor_all_values/reference_snapshots/trading_amount
            research/weighted_momentum_filter_sol
            research/liquidity_wmom_sol
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Run ACT5 direct replacement mechanism test
        run: python research/liquidity_wmom_sol/run_act5_replacement_mechanism.py

      - name: Commit mechanism results
        run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add research/liquidity_wmom_sol/results_act5_replacement_mechanism
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Run ACT5 replacement mechanism test"
            git pull --rebase origin research/factor-lab-sol
            git push origin HEAD:research/factor-lab-sol
          fi

