name: clean-factor-attribution

on:
  push:
    branches:
      - analysis/attribution-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run stock attribution
        run: python analysis/factor_strategy_attribution_fixed.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-factor-attribution-results
          path: analysis/factor_strategy_attribution_results
          if-no-files-found: warn
