name: Trading Value Size Control

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/liquidity_cross_factor/run_size_control.py
      - .github/workflows/liquidity-size-control.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python research/liquidity_cross_factor/run_size_control.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidity_cross_factor/results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add trading value size-control results [skip ci]"
          git push origin HEAD:research/factor-lab-v2
