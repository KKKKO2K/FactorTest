name: momentum-filter-sol

on:
  workflow_dispatch:
  push:
    branches:
      - research/factor-lab-sol
    paths:
      - research/momentum_filter_sol/run_momentum_filter.py
      - research/momentum_filter_sol/README.md
      - .github/workflows/momentum-filter-sol.yml

permissions:
  contents: write

concurrency:
  group: momentum-filter-sol
  cancel-in-progress: false

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas tabulate

      - name: Run momentum filter research
        run: python research/momentum_filter_sol/run_momentum_filter.py

      - name: Compress large diagnostic outputs
        run: |
          test -f research/momentum_filter_sol/results/period_returns.csv && gzip -f research/momentum_filter_sol/results/period_returns.csv || true
          test -f research/momentum_filter_sol/results/paired_vs_base.csv && gzip -f research/momentum_filter_sol/results/paired_vs_base.csv || true

      - name: Commit research results to isolated branch
        run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add research/momentum_filter_sol/results
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Run independent momentum filter research"
            git push origin HEAD:research/factor-lab-sol
          fi
