name: creative-factor-lab

on:
  push:
    branches:
      - analysis/creative-factor-lab
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run creative factor lab
        run: python analysis/creative_factor_lab_fixed.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-factor-lab-results
          path: analysis/creative_factor_results
          if-no-files-found: warn
