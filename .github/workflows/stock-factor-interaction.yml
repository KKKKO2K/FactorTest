name: Stock Factor Interaction

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/stock_level_factor_interaction/run_stock_factor_interaction.py
      - .github/workflows/stock-factor-interaction.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-factor-interaction
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
          sparse-checkout: |
            research/stock_level_factor_interaction
            research/liquidity_cross_factor/run_cross_factor_liquidity.py
            research/liquidity_cross_factor/run_multi_universe_liquidity.py
            source/factor_all_values/reference_snapshots/basic_info
            source/factor_all_values/OP(12MF_1M_CHG)
            source/factor_all_values/OP(FY1_1M_CHG)
            source/factor_all_values/PBR(12MF)
            source/factor_all_values/PER(12MF)
            source/factor_all_values/단기모멘텀
            source/factor_all_values/모멘텀(12-1)
            source/factor_all_values/사모수급
            source/factor_all_values/외국인수급
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run stock-level cross-factor interaction research
        run: python research/stock_level_factor_interaction/run_stock_factor_interaction.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stock_level_factor_interaction/results/
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Add stock-level factor interaction results [skip ci]"
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
