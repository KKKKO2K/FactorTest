name: factor-health-v2-finalize-sol

on:
  workflow_dispatch:
  pull_request:
    branches:
      - research/factor-lab-sol
    paths:
      - research/factor_regime_sol/finalize_factor_health_v2.py
      - .github/workflows/factor-health-v2-finalize-sol.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1
          sparse-checkout: |
            research/factor_regime_sol/results_factor_health_v2
            research/factor_regime_sol/finalize_factor_health_v2.py
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Finalize Factor Health 2.0 summary
        run: python research/factor_regime_sol/finalize_factor_health_v2.py
      - name: Commit finalized summary
        run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add --sparse research/factor_regime_sol/results_factor_health_v2/metric_robustness.csv research/factor_regime_sol/results_factor_health_v2/RESEARCH_SUMMARY.md
          git commit -m "Finalize Factor Health 2.0 summary" || exit 0
          git pull --rebase origin research/factor-lab-sol
          git push origin HEAD:research/factor-lab-sol
# trigger: finalize-fh2
