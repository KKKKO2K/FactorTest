name: Factor Dynamics Transmission

on:
  push:
    branches: [ research/factor-dynamics-transmission ]
    paths:
      - '.github/workflows/factor-dynamics-transmission.yml'
      - 'research/factor_dynamics_transmission/**'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/factor-dynamics-transmission.yml'
      - 'research/factor_dynamics_transmission/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factor-dynamics-transmission
  cancel-in-progress: true

jobs:
  stage5-analog-recurrence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-dynamics-transmission
          fetch-depth: 1
          sparse-checkout: |
            research/factor_regime_v1/results/factor_5d_returns.csv
            research/factor_dynamics_transmission
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run Stage 5 analog recurrence analysis
        working-directory: research/factor_dynamics_transmission
        run: python run_stage5_analog_recurrence.py
      - name: Commit Stage 5 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/factor_dynamics_transmission/results_stage5_analog_recurrence
          git diff --cached --quiet || git commit -m 'Add Factor Dynamics Stage 5 analog recurrence results [skip ci]'
          git pull --rebase origin research/factor-dynamics-transmission
          git push origin HEAD:research/factor-dynamics-transmission
