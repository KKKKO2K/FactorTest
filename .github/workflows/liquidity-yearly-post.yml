name: Trading Value Yearly Post Analysis

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/liquidity_cross_factor/summarize_yearly.py
      - .github/workflows/liquidity-yearly-post.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python research/liquidity_cross_factor/summarize_yearly.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidity_cross_factor/results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add yearly trading value robustness results [skip ci]"
          git push origin HEAD:research/factor-lab-v2
