name: Factor-Level Finalists

on:
  push:
    branches: [ research/factor-lab-v2 ]
    paths:
      - 'research/stock_level_factor_interaction/run_factor_level_finalists.py'
      - '.github/workflows/factor-level-finalists.yml'
      - 'research/stock_level_factor_interaction/audit_cf20_portfolio_tieout.py'
      - 'research/common/chunked_csv.py'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    paths:
      - 'research/stock_level_factor_interaction/run_factor_level_finalists.py'
      - '.github/workflows/factor-level-finalists.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factor-level-finalists
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run factor-level finalist audit
        working-directory: research/stock_level_factor_interaction
        run: python run_factor_level_finalists.py
      - name: Commit finalist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/stock_level_factor_interaction/results_factor_level_finalists
          git diff --cached --quiet || git commit -m 'Add factor-level finalist audit results [skip ci]'
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
