name: Factor Regime Zero Base

on:
  push:
    branches: [ research/factor-regime-zero-base ]
    paths:
      - '.github/workflows/factor-regime-zero-base.yml'
      - 'research/factor_regime_zero_base/**'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/factor-regime-zero-base.yml'
      - 'research/factor_regime_zero_base/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factor-regime-zero-base
  cancel-in-progress: true

jobs:
  liquidity-permission-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-regime-zero-base
          fetch-depth: 1
          sparse-checkout: |
            research/factor_regime_v1/results/factor_5d_returns.csv
            research/factor_regime_v1/results/liquidity_states.csv
            research/factor_regime_zero_base
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run stock liquidity permission policy
        working-directory: research/factor_regime_zero_base
        run: python run_liquidity_permission_policy.py
      - name: Commit liquidity permission outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/factor_regime_zero_base/results_liquidity_permission_policy
          git diff --cached --quiet || git commit -m 'Add stock liquidity permission policy results [skip ci]'
          git pull --rebase origin research/factor-regime-zero-base
          git push origin HEAD:research/factor-regime-zero-base
