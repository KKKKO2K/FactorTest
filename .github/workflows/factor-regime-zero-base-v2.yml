name: Factor Regime Zero Base v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage3-cross-universe-confirmation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-regime-zero-base-v2
          fetch-depth: 1
          sparse-checkout: |
            research/factor_regime_zero_base_v2
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run Stage 3 cross-universe confirmation
        working-directory: research/factor_regime_zero_base_v2
        run: python run_stage3_cross_universe_confirmation.py
