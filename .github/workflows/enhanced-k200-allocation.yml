name: enhanced-k200-allocation

on:
  push:
    branches:
      - analysis/k200-off-engine-lab
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate yfinance
      - name: Export current recommendation
        run: python analysis/k200_current_recommendation_latest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k200-current-recommendation
          path: analysis/k200_current_recommendation
          if-no-files-found: warn
