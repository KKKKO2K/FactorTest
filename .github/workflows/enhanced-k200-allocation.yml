name: enhanced-k200-allocation

on:
  push:
    branches:
      - analysis/enhanced-k200-allocation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate yfinance
      - name: Run enhanced K200 allocation test
        run: python analysis/enhanced_k200_allocation_test.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-k200-allocation-results
          path: analysis/enhanced_k200_results
          if-no-files-found: warn
