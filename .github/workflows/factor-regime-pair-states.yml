name: Factor Regime Pair States

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/factor_regime_pair_states/run_pair_state_research.py
      - .github/workflows/factor-regime-pair-states.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factor-regime-pair-states
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run pair-state research
        run: python research/factor_regime_pair_states/run_pair_state_research.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/factor_regime_pair_states/results/
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Add factor pair-state regime results [skip ci]"
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
