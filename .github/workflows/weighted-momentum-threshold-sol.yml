name: weighted-momentum-threshold-sol

on:
  workflow_dispatch:
  push:
    branches:
      - research/factor-lab-sol
    paths:
      - research/weighted_momentum_filter_sol/run_weighted_momentum_threshold_sensitivity.py
      - .github/workflows/weighted-momentum-threshold-sol.yml

permissions:
  contents: write

concurrency:
  group: weighted-momentum-threshold-sol
  cancel-in-progress: true

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1
          sparse-checkout: |
            source/factor_all_values/reference_snapshots/basic_info
            research/weighted_momentum_filter_sol
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Run exact threshold sensitivity
        run: python research/weighted_momentum_filter_sol/run_weighted_momentum_threshold_sensitivity.py

      - name: Commit threshold results
        run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add research/weighted_momentum_filter_sol/results_threshold
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Run weighted momentum 1M threshold sensitivity"
            git pull --rebase origin research/factor-lab-sol
            git push origin HEAD:research/factor-lab-sol
          fi
