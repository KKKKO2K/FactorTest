name: CF20 Liquidity Portfolio Comparison

on:
  push:
    branches: [ research/factor-lab-v2 ]
    paths:
      - 'research/stock_level_factor_interaction/run_cf20_liquidity_portfolio_comparison.py'
      - 'research/common/chunked_csv.py'
      - '.github/workflows/cf20-liquidity-portfolio-comparison.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run portfolio comparison
        working-directory: research/stock_level_factor_interaction
        run: python run_cf20_liquidity_portfolio_comparison.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/stock_level_factor_interaction/results_cf20_liquidity_portfolio_comparison
          git diff --cached --quiet || git commit -m 'Add CF20 liquidity portfolio comparison results [skip ci]'
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
