name: Factor Lab V2 Research

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/momentum_12_1_short_filter/run_research.py
      - research/momentum_12_1_short_filter/analyze_results.py
      - .github/workflows/factor-lab-v2-research.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Run backtest
        run: python research/momentum_12_1_short_filter/run_research.py

      - name: Run paired and OOS analysis
        run: python research/momentum_12_1_short_filter/analyze_results.py

      - name: Commit research outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/momentum_12_1_short_filter/results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Add MOM12-1 filter research results [skip ci]"
          git push origin HEAD:research/factor-lab-v2
