name: Liquidity Conditional State Research

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/liquidity_cross_factor/run_conditional_state_test_v2.py
      - .github/workflows/liquidity-conditional-state.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run conditional state test
        run: python research/liquidity_cross_factor/run_conditional_state_test_v2.py
      - name: Commit compact outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidity_cross_factor/results_conditional_state/
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Add conditional liquidity state results [skip ci]"
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
