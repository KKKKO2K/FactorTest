name: factor-regime-allocation-nav-sol

on:
  workflow_dispatch:
  push:
    branches:
      - research/factor-lab-sol
    paths:
      - research/factor_regime_sol/run_factor_allocation_nav.py
      - .github/workflows/factor-regime-allocation-nav-sol.yml
  pull_request:
    branches:
      - research/factor-lab-sol
    paths:
      - research/factor_regime_sol/run_factor_allocation_nav.py
      - .github/workflows/factor-regime-allocation-nav-sol.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1
          sparse-checkout: |
            research/factor_regime_sol/results
            research/factor_regime_sol/run_factor_allocation_nav.py
            research/weighted_momentum_filter_sol/run_weighted_momentum_filter.py
            source/factor_all_values/reference_snapshots/basic_info
            source/factor_all_values/OP(12MF_1M_CHG)
            source/factor_all_values/OP(FY1_1M_CHG)
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Run NAV backtest and persist status
        run: |
          set +e
          mkdir -p research/factor_regime_sol/allocation_nav_run_status
          python research/factor_regime_sol/run_factor_allocation_nav.py > research/factor_regime_sol/allocation_nav_run_status/run.log 2>&1
          echo "$?" > research/factor_regime_sol/allocation_nav_run_status/exit_code.txt
          cat research/factor_regime_sol/allocation_nav_run_status/run.log
          exit 0
      - name: Commit results
        run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add --sparse research/factor_regime_sol/results_allocation_nav research/factor_regime_sol/allocation_nav_run_status
          git commit -m "Run factor allocation NAV backtest" || exit 0
          git pull --rebase origin research/factor-lab-sol
          git push origin HEAD:research/factor-lab-sol

# temporary PR trigger
