name: Alternative Liquidity Veto H10 Fast

on:
  push:
    branches: [ research/factor-lab-v2 ]
    paths:
      - 'research/stock_level_factor_interaction/run_alt_liquidity_veto_h10_fast.py'
      - '.github/workflows/alt-liquidity-veto-h10-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run H10 main sensitivity
        working-directory: research/stock_level_factor_interaction
        run: python run_alt_liquidity_veto_h10_fast.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/stock_level_factor_interaction/results_alt_liquidity_veto_h10_fast
          git diff --cached --quiet || git commit -m 'Add chunked H10 liquidity results [skip ci]'
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
