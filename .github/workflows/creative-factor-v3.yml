name: creative-factor-v3

on:
  push:
    branches:
      - analysis/creative-factor-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run creative factor v3
        run: python analysis/creative_factor_lab_v3.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-factor-v3-results
          path: analysis/creative_factor_results_v3
          if-no-files-found: warn
