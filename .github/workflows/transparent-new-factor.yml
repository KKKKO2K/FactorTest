name: transparent-new-factor

on:
  push:
    branches:
      - analysis/all-factors-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run milder transparent rule tests
        run: python analysis/test_transparent_new_factor_rules_v2.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transparent-new-factor-results-v2
          path: analysis/transparent_rule_results_v2
          if-no-files-found: warn
