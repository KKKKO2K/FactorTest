name: Liquidity Multi-Universe Research

on:
  push:
    branches:
      - research/factor-lab-v2
    paths:
      - research/liquidity_cross_factor/run_multi_universe_liquidity.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run multi-universe liquidity research
        run: python research/liquidity_cross_factor/run_multi_universe_liquidity.py
      - name: Commit compact outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f research/liquidity_cross_factor/results_multi_universe/periods.csv
          git add \
            research/liquidity_cross_factor/results_multi_universe/RESEARCH_SUMMARY.md \
            research/liquidity_cross_factor/results_multi_universe/aggregate.csv \
            research/liquidity_cross_factor/results_multi_universe/frozen_direction_oos.csv \
            research/liquidity_cross_factor/results_multi_universe/summary.csv \
            research/liquidity_cross_factor/results_multi_universe/train_oos_decay.csv \
            research/liquidity_cross_factor/results_multi_universe/vs_base.csv
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Add multi-universe liquidity results [skip ci]"
          git push origin HEAD:research/factor-lab-v2
