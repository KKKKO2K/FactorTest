name: k200-universe-portability-parallel

on:
  push:
    branches:
      - analysis/k200-universe-expansion-parallel-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: LOCAL
            universe: K200
          - mode: LOCAL
            universe: KOSPI_ALL
          - mode: LOCAL
            universe: KOSPI_EX_K200
          - mode: LOCAL
            universe: KOSDAQ
          - mode: EXPANDED
            universe: KOSPI_ALL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Overlay latest main factor data
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- source/factor_all_values
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate yfinance requests
      - name: Run universe portability slice
        env:
          MODE: ${{ matrix.mode }}
          UNIVERSE: ${{ matrix.universe }}
        run: python analysis/k200_universe_portability_single.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-${{ matrix.mode }}-${{ matrix.universe }}
          path: analysis/k200_universe_portability_parallel_results/${{ matrix.mode }}_${{ matrix.universe }}
          if-no-files-found: warn
