name: k200-aug7-refresh

on:
  push:
    branches:
      - analysis/k200-off-engine-lab
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Overlay latest main factor data
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- source/factor_all_values
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate yfinance requests
      - name: Run Aug 7 refresh
        run: python analysis/k200_aug7_refresh_fixed2.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k200-aug7-refresh-results
          path: analysis/k200_aug7_refresh_results
          if-no-files-found: warn
