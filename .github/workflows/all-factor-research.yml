name: all-factor-research

on:
  push:
    branches:
      - analysis/all-factors-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode embedded source
        run: python analysis/decode_all_factor_source.py
      - name: Upload decoded source
        uses: actions/upload-artifact@v4
        with:
          name: decoded-all-factor-source
          path: analysis/decoded_all_factor_source.py
