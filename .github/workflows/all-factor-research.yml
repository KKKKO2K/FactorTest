name: all-factor-research

on:
  push:
    branches:
      - analysis/all-factors-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn tabulate
      - name: Inventory factors
        run: python analysis/inventory_all_factors.py
      - name: Run focused all-factor strategy research
        run: python analysis/run_all_factor_research_fast.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-factor-research-focused-results
          path: |
            analysis/all_factor_inventory
            analysis/all_factor_results
          if-no-files-found: warn
