name: weighted-momentum-diagnostics-sol

on:
  workflow_dispatch:
  push:
    branches:
      - research/factor-lab-sol
    paths:
      - research/weighted_momentum_filter_sol/summarize_filter_diagnostics.py
      - .github/workflows/weighted-momentum-diagnostics-sol.yml

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-sol
          fetch-depth: 1
          sparse-checkout: |
            research/weighted_momentum_filter_sol
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python research/weighted_momentum_filter_sol/summarize_filter_diagnostics.py
      - run: |
          git config user.name "factor-lab-sol-bot"
          git config user.email "factor-lab-sol-bot@users.noreply.github.com"
          git add research/weighted_momentum_filter_sol/results/filter_diagnostics_summary.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Summarize weighted momentum filter surgery"
            git pull --rebase origin research/factor-lab-sol
            git push origin HEAD:research/factor-lab-sol
          fi
