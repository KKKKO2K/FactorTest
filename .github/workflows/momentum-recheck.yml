name: Weighted Momentum Recheck

on:
  push:
    branches: [ research/factor-lab-v2 ]
    paths:
      - 'research/momentum_recheck/run_momentum_recheck.py'
      - 'research/momentum_recheck/run_momentum_recheck_fixed.py'
      - 'research/momentum_recheck/run_momentum_stage1.py'
      - 'research/momentum_recheck/run_momentum_primary_only.py'
      - '.github/workflows/momentum-recheck.yml'
      - 'research/common/chunked_csv.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weighted-momentum-recheck
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-lab-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run weighted momentum primary gate
        working-directory: research/momentum_recheck
        run: python run_momentum_primary_only.py
      - name: Commit research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/momentum_recheck/results
          git diff --cached --quiet || git commit -m 'Add weighted momentum primary-gate results [skip ci]'
          git pull --rebase origin research/factor-lab-v2
          git push origin HEAD:research/factor-lab-v2
