name: Connector Finalist Regime Audit

on:
  push:
    branches: [ research/connector-friendly-finalist-export ]
    paths:
      - '.github/workflows/connector-finalist-regime-audit.yml'
      - 'research/stock_level_factor_interaction/run_factor_level_finalists.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_overlay.py'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/connector-finalist-regime-audit.yml'
      - 'research/stock_level_factor_interaction/run_factor_level_finalists.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_overlay.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connector-finalist-regime-audit
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/connector-friendly-finalist-export
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Rebuild finalist daily exports
        working-directory: research/stock_level_factor_interaction
        run: python run_factor_level_finalists.py
      - name: Run exact finalist regime overlay audit
        working-directory: research/factor_regime_action_policy
        run: python run_finalist_regime_overlay.py
      - name: Commit scratch audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/stock_level_factor_interaction/results_factor_level_finalists/daily_returns_text
          git add research/factor_regime_action_policy/results/finalist_regime_overlay
          git diff --cached --quiet || git commit -m 'Add connector finalist regime audit results [skip ci]'
          git pull --rebase origin research/connector-friendly-finalist-export
          git push origin HEAD:research/connector-friendly-finalist-export
