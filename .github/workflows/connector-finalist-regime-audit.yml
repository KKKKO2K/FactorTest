name: Connector Finalist Regime Audit

on:
  push:
    branches: [ research/connector-friendly-finalist-export ]
    paths:
      - '.github/workflows/connector-finalist-regime-audit.yml'
      - 'research/stock_level_factor_interaction/run_factor_level_finalists.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_overlay.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_diagnostics.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_execution.py'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/connector-finalist-regime-audit.yml'
      - 'research/stock_level_factor_interaction/run_factor_level_finalists.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_overlay.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_diagnostics.py'
      - 'research/factor_regime_action_policy/run_finalist_regime_execution.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connector-finalist-regime-audit
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/connector-friendly-finalist-export
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Convert existing finalist gzip to connector-friendly CSVs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('research/stock_level_factor_interaction/results_factor_level_finalists')
          parts = sorted((root / 'finalist_daily_returns_parts').glob('finalist_daily_returns.part-*.csv.gz'))
          if not parts:
              raise FileNotFoundError('No finalist_daily_returns gzip parts found')
          daily = pd.concat([pd.read_csv(p) for p in parts], ignore_index=True)
          out = root / 'daily_returns_text'
          out.mkdir(parents=True, exist_ok=True)
          manifest = []
          for variant, x in daily.groupby('variant', sort=True):
              x = x.sort_values(['date', 'phase'])
              path = out / f'{variant}.csv'
              x.to_csv(path, index=False, encoding='utf-8', lineterminator='\n')
              manifest.append({
                  'variant': variant,
                  'file': path.name,
                  'rows': len(x),
                  'date_start': x['date'].min(),
                  'date_end': x['date'].max(),
                  'phases': x['phase'].nunique(),
              })
          pd.DataFrame(manifest).to_csv(out / 'manifest.csv', index=False, encoding='utf-8', lineterminator='\n')
          print(f'parts={len(parts)} rows={len(daily):,} variants={len(manifest)}')
          PY
      - name: Run exact finalist regime overlay audit
        working-directory: research/factor_regime_action_policy
        run: python run_finalist_regime_overlay.py
      - name: Run candidate-specific regime diagnostics
        working-directory: research/factor_regime_action_policy
        run: python run_finalist_regime_diagnostics.py
      - name: Run rebalance-aligned regime execution audit
        working-directory: research/factor_regime_action_policy
        run: python run_finalist_regime_execution.py
      - name: Commit scratch audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/stock_level_factor_interaction/results_factor_level_finalists/daily_returns_text
          git add research/factor_regime_action_policy/results/finalist_regime_overlay
          git add research/factor_regime_action_policy/results/finalist_regime_diagnostics
          git add research/factor_regime_action_policy/results/finalist_regime_execution
          git diff --cached --quiet || git commit -m 'Add connector finalist regime audit results [skip ci]'
          git pull --rebase origin research/connector-friendly-finalist-export
          git push origin HEAD:research/connector-friendly-finalist-export
