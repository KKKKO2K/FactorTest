name: Connector Finalist Regime Audit

on:
  push:
    branches: [ research/connector-friendly-finalist-export ]
    paths:
      - '.github/workflows/connector-finalist-regime-audit.yml'
      - 'research/factor_regime_market_incremental/run_transition_probability_allocation.py'
  pull_request:
    branches: [ research/factor-lab-v2 ]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/connector-finalist-regime-audit.yml'
      - 'research/factor_regime_market_incremental/run_transition_probability_allocation.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connector-finalist-regime-audit
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/connector-friendly-finalist-export
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run transition probability allocation audit
        working-directory: research/factor_regime_market_incremental
        run: python run_transition_probability_allocation.py
      - name: Commit transition allocation outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/factor_regime_market_incremental/results_transition_allocation
          git diff --cached --quiet || git commit -m 'Add transition probability allocation results [skip ci]'
          git pull --rebase origin research/connector-friendly-finalist-export
          git push origin HEAD:research/connector-friendly-finalist-export
