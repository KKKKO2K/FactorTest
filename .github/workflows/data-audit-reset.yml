name: Data Audit Reset

on:
  push:
    branches: [ research/data-audit-reset ]
    paths:
      - '.github/workflows/data-audit-reset.yml'
      - 'research/data_audit_reset/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-audit-reset
  cancel-in-progress: true

jobs:
  run-data-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/data-audit-reset
          fetch-depth: 1
          sparse-checkout: |
            source/factor_all_values
            research/data_audit_reset
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy pandas
      - name: Run source data audit
        working-directory: research/data_audit_reset
        run: python run_data_audit.py
      - name: Commit audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/data_audit_reset/results
          git diff --cached --quiet || git commit -m 'Add source data audit results [skip ci]'
          git pull --rebase origin research/data-audit-reset
          git push origin HEAD:research/data-audit-reset
